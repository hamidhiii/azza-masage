<head>

<title>AZZA MASSAGE TASHKENT</title>
<style>
  :root{
    --bg-dark:#14110c;
    --bg-dark2:#1c1811;
    --gold:#c79a5b;
    --gold-soft:#e3c690;
    --accent:#b5764a;
    --card-bg:rgba(255,250,240,0.045);
    --card-border:rgba(199,154,91,0.28);
    --text:#efe6d6;
    --text-dim:#a89a84;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(199,154,91,0.07), transparent 60%),
      linear-gradient(180deg, #17130d 0%, #1e1810 45%, #14110c 100%);
    background-attachment:fixed;
    position:relative;
    overflow-x:hidden;
  }
  /* faint vertical "plant/wood slat" texture bars, evoking the venue photo */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:repeating-linear-gradient(
      90deg,
      rgba(199,154,91,0.035) 0px,
      rgba(199,154,91,0.035) 2px,
      transparent 2px,
      transparent 42px
    );
    pointer-events:none;
    z-index:0;
  }
  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:56px 22px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .logo-badge{
    width:190px;
    height:190px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    filter:drop-shadow(0 0 18px rgba(199,154,91,0.25)) drop-shadow(0 0 40px rgba(199,154,91,0.12));
    margin-bottom:26px;
  }
  .logo-badge img{
    width:100%;
    height:100%;
    object-fit:contain;
  }

  h1{
    font-size:26px;
    letter-spacing:4px;
    font-weight:800;
    color:var(--gold-soft);
    text-align:center;
    text-shadow:0 0 18px rgba(240,198,116,0.35);
  }
  .subtitle{
    margin-top:10px;
    font-size:15px;
    color:var(--text-dim);
    text-align:center;
    max-width:340px;
    line-height:1.5;
  }

  .links{
    width:100%;
    margin-top:38px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .link-card{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:18px 20px;
    border-radius:14px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    color:var(--text);
    text-decoration:none;
    backdrop-filter:blur(6px);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .link-card:hover, .link-card:active{
    transform:translateY(-2px);
    border-color:rgba(199,154,91,0.55);
    box-shadow:0 6px 20px rgba(199,154,91,0.12);
  }
  .link-card .icon{
    width:38px;
    height:38px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(217,164,65,0.12);
    border:1px solid rgba(217,164,65,0.4);
  }
  .link-card .icon svg{width:19px;height:19px;fill:var(--gold-soft);}
  .link-card .label{
    display:flex;
    flex-direction:column;
    line-height:1.25;
  }
  .link-card .label .title{
    font-size:16px;
    font-weight:700;
    letter-spacing:0.5px;
  }

  .divider{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:rgba(217,164,65,0.4);
    font-size:12px;
  }
  .divider .line{flex:1;height:1px;background:linear-gradient(90deg, transparent, rgba(217,164,65,0.35), transparent);}

  footer{
    margin-top:44px;
    text-align:center;
    color:rgba(201,184,154,0.55);
    font-size:12.5px;
    letter-spacing:0.5px;
  }
  footer .brand{color:var(--gold-soft);font-weight:700;}

  @media (max-width:360px){
    .logo-badge{width:160px;height:160px;}
    h1{font-size:22px;}
  }
</style>
</head>
